[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[project]
name = "ripple-backend"
version = "0.1.0"
description = "Enterprise Business Change Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "gradio>=6.28.0",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.14.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "spaces>=0.51.3",
    "spacy>=3.8.16",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
